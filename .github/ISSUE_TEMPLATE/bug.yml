name: Bug report
description: A reproducible defect in the library or lab.
body:
  - type: input
    id: version
    attributes:
      label: ToolStorm and Python versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include rules, seed, expected behavior, and observed behavior. Remove credentials and private payloads.
      render: python
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Contract or trace evidence
      description: Share only sanitized evidence. Use private security reporting for sensitive findings.
